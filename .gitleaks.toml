[extend]
useDefault = true

[[allowlists]]
description = "Dependencies, build output, local browser state and Git internals are audited separately"
paths = [
  '''(^|[\\/])(node_modules|outputs|dist|coverage|release|work|\.git|\.playwright-mcp)([\\/]|$)''',
]

[[allowlists]]
description = "Clearly synthetic example.com credentials in the current cURL parser test"
condition = "AND"
paths = ['''(^|[\\/])tests[\\/]claude-curl\.test\.ts$''']
regexTarget = "line"
regexes = ['''(sk-example-not-real|key-example)''']
