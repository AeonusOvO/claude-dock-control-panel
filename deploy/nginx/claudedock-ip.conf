limit_conn_zone $binary_remote_addr zone=claudedock_downloads:10m;

server {
    listen 80;
    listen [::]:80;
    server_name 124.221.158.247;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://124.221.158.247$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 124.221.158.247;

    access_log /var/log/nginx/claudedock-access.log combined;
    error_log /var/log/nginx/claudedock-error.log warn;

    ssl_certificate /etc/letsencrypt/live/124.221.158.247/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/124.221.158.247/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ClaudeDockTLS:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    server_tokens off;
    send_timeout 60s;
    keepalive_timeout 15s;
    reset_timedout_connection on;

    if ($host != 124.221.158.247) {
        return 421;
    }

    location = /claudedock/health {
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        return 200 "ok\n";
    }

    location = /claudedock/windows/x64 {
        return 308 https://124.221.158.247/claudedock/windows/x64/;
    }

    location = /claudedock/windows/x64/latest.yml {
        alias /srv/claudedock/current/latest.yml;
        limit_except GET HEAD {
            deny all;
        }
        add_header Accept-Ranges "bytes" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /claudedock/windows/x64/release-manifest.json {
        alias /srv/claudedock/current/release-manifest.json;
        limit_except GET HEAD {
            deny all;
        }
        add_header Accept-Ranges "bytes" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /claudedock/windows/x64/release-manifest.sig {
        alias /srv/claudedock/current/release-manifest.sig;
        limit_except GET HEAD {
            deny all;
        }
        add_header Accept-Ranges "bytes" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /claudedock/windows/x64/ {
        alias /srv/claudedock/current/;
        autoindex off;
        etag on;
        limit_conn claudedock_downloads 4;
        limit_rate_after 1m;
        limit_rate 512k;
        limit_except GET HEAD {
            deny all;
        }
        add_header Accept-Ranges "bytes" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
