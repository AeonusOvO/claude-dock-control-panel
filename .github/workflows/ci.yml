name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # electron-builder downloads the runtime during `install-app-deps`; keep it out of the log.
  ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: 'true'

jobs:
  verify:
    # The app is Windows-only: node-pty binds ConPTY and the installer target is NSIS.
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check dependency layering
        run: npm run lint:deps

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
