name: 功能建议
description: 提议一个明确、精简且可验证的改进
title: '[Feature] '
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述当前限制、受影响场景和为什么现有功能不足。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 写清用户流程、可见结果和成功标准。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
      description: 包括不修改产品、复用现有入口或缩小范围的方案。
  - type: textarea
    id: scope
    attributes:
      label: 范围与边界
      description: 说明不应包含的内容、兼容性要求，以及是否影响终端、网络、更新或打包。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 Issue，未发现同一建议。
          required: true
        - label: 该建议复用现有概念，未要求增加重复入口、平行状态源或无关文档。
          required: true
